name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-kit:
    # Kit + Features build and test on Linux (SPEC-MAC §3); contract tests skip without MP_BASE_URL.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test --skip-build

  linux-kit-swift510:
    # Same as linux-kit on Swift 5.10 (Xcode 15.4's compiler), the oldest toolchain we support.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test --skip-build

  linux-contract:
    # Like the BE `contract` job: BE main, migrated + full seed, then the Swift contract tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asana
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Inside the job container the service is reachable by its name.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/asana
      JWT_SECRET: ci-only-secret-at-least-16-chars
      APP_URL: http://localhost:5173
      APP_TIMEZONE: Asia/Jakarta
      NODE_ENV: development
      PORT: "3000"
      HOST: 127.0.0.1
      # The contract suite logs in ~15 times from one IP; the BE default is 10/min.
      AUTH_RATE_LIMIT_MAX: "1000"
      MP_BASE_URL: http://127.0.0.1:3000
      # Attachments (BE SPEC §13): the same BE build and DB on two more ports, for the 429 and
      # 507 cases. Contract tests that need one skip when its variable is unset (local runs).
      MP_BASE_URL_RATELIMIT: http://127.0.0.1:3001
      MP_BASE_URL_NOSPACE: http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aviandri/asana-clone-be
          # github.token can only read this repo; if asana-clone-be is private, add a fine-grained
          # read-only PAT (Contents: read on asana-clone-be) as the BE_REPO_TOKEN secret.
          token: ${{ secrets.BE_REPO_TOKEN || github.token }}
          ref: main
          path: be
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: be/package-lock.json
      - name: Backend (migrate, build, seed, start)
        working-directory: be
        run: |
          npm ci
          npx prisma migrate deploy
          npm run build
          npm run seed
          export STORAGE_DIR="$RUNNER_TEMP/attachments"
          nohup npm start > ../be.log 2>&1 &
          # :3001 allows 3 uploads a minute (429 RATE_LIMITED); :3002 always wants more free space
          # than the disk has (507 INSUFFICIENT_STORAGE).
          PORT=3001 UPLOAD_RATE_LIMIT_MAX=3 nohup npm start > ../be-ratelimit.log 2>&1 &
          PORT=3002 STORAGE_MIN_FREE_BYTES=1000000000000000000 nohup npm start > ../be-nospace.log 2>&1 &
          for port in 3000 3001 3002; do
            ok=
            for i in $(seq 1 30); do
              node -e "fetch('http://127.0.0.1:$port/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && { ok=1; break; }
              sleep 1
            done
            [ -n "$ok" ] || { echo "backend :$port did not become healthy"; cat ../be*.log; exit 1; }
          done
      - run: swift build --build-tests
      - name: Contract tests
        # A skipped contract test (a variable missing, no seeded workspace) would pass silently, so
        # fail unless at least one ran and none were skipped.
        shell: bash
        run: |
          set -o pipefail
          swift test --skip-build --filter ContractTests 2>&1 | tee contract.log
          passed=$(grep -c "^Test Case '.*' passed" contract.log || true)
          skipped=$(grep -c "^Test Case '.*' skipped" contract.log || true)
          echo "contract tests: $passed passed, $skipped skipped"
          [ "$passed" -gt 0 ] && [ "$skipped" -eq 0 ]
      - name: Backend logs
        if: always()
        run: for f in be.log be-ratelimit.log be-nospace.log; do echo "== $f"; cat "$f" || true; done

  macos-app:
    # Newest toolchain (Xcode 16.4, macOS 15 SDK) as a forward-compat signal: package tests, then
    # build + test (unsigned). Release artifacts come from macos-xcode15: v0.1.0 built here crashed
    # on macOS 14 (SDK-15 AppKit field-editor behaviour). On main it also uploads a Debug build
    # with get-task-allow, so QA can attach lldb on a device and investigate the SDK-15 path.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PROJECT: MekariProject.xcodeproj
      SCHEME: MekariProjectApp
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Package tests on macOS
        run: swift test
      - name: Build and test the app
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build test
      - name: Add-field UI tests against an optimised (UITest) build
        # The add-field flows crashed in a Release build (v0.1.0), so they also run optimised here. UITest is
        # Release plus the fake-API boot path, which the shipped Release build doesn't contain.
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration UITest -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
            -only-testing:MekariProjectUITests/AppFlowUITests/testRapidInlineAddTaskInMyTasksAndAProject \
            -only-testing:MekariProjectUITests/AppFlowUITests/testTypingInTheAddFieldWhileTheListUpdates \
            -only-testing:MekariProjectUITests/AppFlowUITests/testUndoInTheInspectorTitleWorksAfterAnAdd \
            build test
      - name: Debug build for lldb (universal, ad-hoc signed, get-task-allow)
        # One binary (no Xcode 16 debug dylib), so a plain ad-hoc signature with the entitlement works.
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build/debug \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO build
          APP="build/debug/Build/Products/Debug/Mekari Project.app"
          /usr/libexec/PlistBuddy -c 'Add :com.apple.security.get-task-allow bool true' build/debug.entitlements
          codesign --force --deep --sign - --entitlements build/debug.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q get-task-allow
          lipo -archs "$APP/Contents/MacOS/Mekari Project"
          /usr/libexec/PlistBuddy -c 'Print :DTXcode' -c 'Print :DTSDKName' "$APP/Contents/Info.plist"
          ditto -c -k --keepParent "$APP" "build/MekariProject-debug-xcode16-${GITHUB_SHA::7}.zip"
      - name: Upload Debug build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MekariProject-debug-xcode16-${{ github.sha }}
          path: build/MekariProject-debug-xcode16-*.zip
          retention-days: 14

  macos-xcode15:
    # The release build. macOS 14 + Xcode 15.4 (Swift 5.10, macOS 14.5 SDK; deployment target 14.0,
    # so it runs on 14 and 15): build + test (Debug), the UI tests again on Release, then a
    # universal Release archive, ad-hoc signed, launch-smoked and zipped (uploaded on main and
    # tags). Building against the 14 SDK is deliberate: see macos-app.
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PROJECT: MekariProject.xcodeproj
      SCHEME: MekariProjectApp
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - run: xcodebuild -version && swift --version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and test the app
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build test
      - name: UI tests against an optimised (UITest) build
        # Shipped builds are Release (optimized), and Debug/Release diverged once (v0.1.0). UITest = Release
        # plus the fake-API boot path. Runs the whole UI target.
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration UITest \
            -destination 'platform=macOS' -resultBundlePath build/ReleaseUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES -only-testing:MekariProjectUITests build test
      - name: Upload Release UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-uitests-xcresult
          path: build/ReleaseUITests.xcresult
          retention-days: 14
      - name: Version
        id: version
        # Tags v1.2.3 / v1.2.3-rc1 stamp MARKETING_VERSION 1.2.3 and name the zip after the tag;
        # other builds keep project.yml's version and use the short SHA. Build number = run number.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]] \
              || { echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
            echo "marketing=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "label=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "label=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Archive (Release, universal)
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=macOS' -archivePath build/MekariProject.xcarchive \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" ${MARKETING:+MARKETING_VERSION="$MARKETING"} archive
          APP="build/MekariProject.xcarchive/Products/Applications/Mekari Project.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Mekari Project" | tee /dev/stderr | grep -q 'x86_64 arm64\|arm64 x86_64'
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$PLIST"
          # Ship only SDK-14 builds (a runner image change must not silently switch the SDK).
          sdk=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$PLIST")
          [[ "$sdk" == macosx14.* ]] || { echo "release build uses SDK $sdk, expected macosx14.*"; exit 1; }
          xcode=$(/usr/libexec/PlistBuddy -c 'Print :DTXcode' "$PLIST")
          xbuild=$(/usr/libexec/PlistBuddy -c 'Print :DTXcodeBuild' "$PLIST")
          echo "DTXcode=$xcode ($xbuild) DTSDKName=$sdk" | tee build/BUILD-INFO.txt
      - name: No fake path in the shipped app
        # The Release archive must not contain the fake-API boot path (compiled only for Debug/UITest).
        # Scans all bytes for both flags (a short literal can sit inline in __TEXT,__text, which `strings`
        # skips by default), and first requires a hit in this job's UITest build, so a blind check fails.
        run: |
          has_flag() { grep -a -q -e '-UITestFakeAPI' -e '-UITestSignedOut' "$1" || strings -a "$1" | grep -q -e '-UITestFakeAPI' -e '-UITestSignedOut'; }
          UIT_DIR=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration UITest -showBuildSettings 2>/dev/null | awk -F' = ' '/^ *BUILT_PRODUCTS_DIR /{print $2; exit}')
          CONTROL="$UIT_DIR/Mekari Project.app/Contents/MacOS/Mekari Project"
          has_flag "$CONTROL" || { echo "check is blind: the UITest build should contain the flags"; exit 1; }
          BIN="build/MekariProject.xcarchive/Products/Applications/Mekari Project.app/Contents/MacOS/Mekari Project"
          if has_flag "$BIN"; then echo "Release binary contains the fake-API flags"; exit 1; fi
          echo "fake-API flags: present in the UITest build, absent from the Release archive"
      - name: Launch smoke (Release app)
        # Start the shipped (archived) app for 5 s, signed out with no server, and fail if it exits or leaves
        # a crash report. The fake-API launch is covered by the UITest-configuration UI tests above.
        run: |
          BIN="build/MekariProject.xcarchive/Products/Applications/Mekari Project.app/Contents/MacOS/Mekari Project"
          REPORTS="$HOME/Library/Logs/DiagnosticReports"
          find "$REPORTS" -iname '*Mekari*' -delete 2>/dev/null || true
          "$BIN" > build/launch.log 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"; echo "app exited within 5 s (status $?)"; cat build/launch.log; exit 1
          fi
          kill "$pid"; wait "$pid" 2>/dev/null || true
          if find "$REPORTS" -iname '*Mekari*' 2>/dev/null | grep -q .; then
            echo "crash report found:"; find "$REPORTS" -iname '*Mekari*' -exec head -40 {} \; ; exit 1
          fi
          echo "app stayed up for 5 s"
      - name: Zip
        run: |
          ditto -c -k --keepParent "build/MekariProject.xcarchive/Products/Applications/Mekari Project.app" \
            "build/MekariProject-${{ steps.version.outputs.label }}.zip"
      - name: Upload app
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: MekariProject-${{ github.sha }}
          path: |
            build/MekariProject-*.zip
            build/BUILD-INFO.txt
          retention-days: 30

  macos14-xcode16:
    # The combination that crashed v0.1.0 on a device: an app linked against the macOS 15 SDK
    # (newest Xcode 16.x on the macos-14 image) running on macOS 14. Release build, hosted tests
    # + the add-field UI tests. A signal only: allowed to fail and not a release gate (releases
    # ship the Xcode 15.4 build).
    runs-on: macos-14
    timeout-minutes: 30
    continue-on-error: true
    env:
      PROJECT: MekariProject.xcodeproj
      SCHEME: MekariProjectApp
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version && xcrun --show-sdk-version && sw_vers -productVersion
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Optimised (UITest) build, hosted tests and add-field UI tests
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration UITest -destination 'platform=macOS' \
            -resultBundlePath build/macos14-xcode16.xcresult \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
            -only-testing:MekariProjectAppTests \
            -only-testing:MekariProjectUITests/AppFlowUITests/testRapidInlineAddTaskInMyTasksAndAProject \
            -only-testing:MekariProjectUITests/AppFlowUITests/testTypingInTheAddFieldWhileTheListUpdates \
            -only-testing:MekariProjectUITests/AppFlowUITests/testUndoInTheInspectorTitleWorksAfterAnAdd \
            build test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos14-xcode16-xcresult
          path: build/macos14-xcode16.xcresult
          retention-days: 14

  release:
    # v* tags only: a GitHub Release with macos-xcode15's universal zip and notes generated from
    # merged PRs, prefixed with install steps and the toolchain that built it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-kit, linux-kit-swift510, linux-contract, macos-app, macos-xcode15]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MekariProject-${{ github.sha }}
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          notes=$(cat <<'NOTES'
          Universal (Apple Silicon + Intel), macOS 14+. Unsigned (ad-hoc), not notarized. To install:

          1. Delete any old `Mekari Project.app` / `MekariProject-*.zip` in Downloads first (otherwise the new one unzips as "Mekari Project 2.app").
          2. Unzip, **drag Mekari Project.app into Applications in Finder** (not `mv` in Terminal), and launch it from there.
          3. If macOS says it "can't be opened because Apple cannot check it for malicious software": click OK, open **System Settings → Privacy & Security**, scroll to "Mekari Project was blocked…", click **Open Anyway** and confirm. Right-click → Open also works on macOS 14. Or in Terminal: `xattr -dr com.apple.quarantine "/Applications/Mekari Project.app"`
          4. Delete the zip and anything else left in Downloads.

          The proper fix is Developer ID signing + notarization (needs an Apple Developer account). See the README for details.
          NOTES
          )
          # Which toolchain built the zip, e.g. "DTXcode=1540 (15F31d) DTSDKName=macosx14.5".
          notes="Built with Xcode 15.4 on macos-14: \`$(cat dist/BUILD-INFO.txt)\`"$'\n\n'"$notes"
          gh release create "$GITHUB_REF_NAME" dist/*.zip -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "Mekari Project ${GITHUB_REF_NAME#v}" "${prerelease[@]}" --generate-notes \
            --notes "$notes"
