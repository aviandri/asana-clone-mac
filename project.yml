# XcodeGen spec: `xcodegen generate` → MekariProject.xcodeproj (generated, not committed).
name: MekariProject
options:
  bundleIdPrefix: com.mekari
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # objectVersion 63: the newest format Xcode 15.3/15.4 opens (xcodegen's default, 77, needs Xcode 16).
  projectFormat: xcode15_3
# UITest = Release (optimised) plus the fake-API boot path, for CI's Release-mode UI tests and launch
# smoke. The shipped Release archive compiles the fake path out (AppBootstrap: #if DEBUG || UITEST).
configs:
  Debug: debug
  Release: release
  UITest: release
settings:
  configs:
    UITest:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) UITEST"
      # The @testable hosted test bundle builds against it too.
      ENABLE_TESTABILITY: YES
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Unsigned v1 (SPEC-MAC §2): ad-hoc signature only, no team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  MekariProject:
    path: .
targets:
  MekariProjectApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/AppIcon.svg
    dependencies:
      - package: MekariProject
        product: MekariProjectKit
      - package: MekariProject
        product: MekariProjectFeatures
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mekari Project
        CFBundleName: Mekari Project
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: false
        NSHumanReadableCopyright: © Mekari
        CFBundleURLTypes:
          - CFBundleURLName: com.mekari.project
            CFBundleURLSchemes:
              - mekariproject
    settings:
      base:
        PRODUCT_NAME: Mekari Project
        PRODUCT_MODULE_NAME: MekariProjectApp
        PRODUCT_BUNDLE_IDENTIFIER: com.mekari.project
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  MekariProjectAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: MekariProjectApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mekari.project.tests
        # XcodeGen derives the host from the target name; the product is "Mekari Project.app".
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mekari Project.app/Contents/MacOS/Mekari Project"
        BUNDLE_LOADER: "$(TEST_HOST)"
  MekariProjectUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: MekariProjectApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mekari.project.uitests
        TEST_TARGET_NAME: MekariProjectApp
schemes:
  MekariProjectApp:
    build:
      targets:
        MekariProjectApp: all
    test:
      targets:
        - MekariProjectAppTests
        - MekariProjectUITests
    archive:
      config: Release
